name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Nons workspace
        uses: actions/checkout@v4
        with:
          repository: Miaoyww/Nons
          path: workspace
      - name: Checkout adapter
        uses: actions/checkout@v4
        with:
          path: workspace/adapters/gdstudio
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            workspace/packages/wasm-crypto/package-lock.json
            workspace/adapters/gdstudio/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix workspace/packages/wasm-crypto --include=dev
          npm ci --prefix workspace/adapters/gdstudio
      - name: Build Component
        run: node workspace/adapters/gdstudio/scripts/build.mjs
        env:
          NONS_ROOT: ${{ github.workspace }}/workspace
      - name: Run tests
        working-directory: workspace/adapters/gdstudio
        run: |
          node --test tests/*.test.mjs
      - name: Package release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p workspace/out
          (cd workspace/app/src-tauri/bundled-adapters && zip -qr "../../../out/nsa-gdstudio-${GITHUB_REF_NAME}.zip" gdstudio)
          (cd workspace/out && sha256sum *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: nsa-gdstudio-release
          path: workspace/out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nsa-gdstudio-release
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
          fi
